name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Husky's `prepare` hook has no job to do in CI.
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so any module that validates config at import time has a
      # value. Vitest sets its own (vitest.config.ts); nothing here reaches a
      # real service. `next build` is deliberately not run in CI: it needs real
      # secrets and Vercel already builds every PR.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_anon_key_placeholder_____________
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_key_placeholder_________
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Generates the route and page prop types `tsc` depends on.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
